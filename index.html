<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>مراجعة وحدة الضرب</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: header + 40-minute session strip, then the stage "board" beside a control / score panel; stacks on phones */
:root{
  --bg:#EDF3F2;--surface:#FFFFFF;--surface-2:#E3ECEA;--ink:#0F2F35;--muted:#56707A;--line:#C9D9D6;
  --saffron:#F2B705;--saffron-soft:#FDF1C4;--on-saffron:#2E2200;
  --teal:#0E7C70;--teal-soft:#D3EEEA;--on-teal:#FFFFFF;
  --good:#23824A;--good-soft:#DCF2E4;--bad:#C3412E;--bad-soft:#FBE4DF;
  --shadow:0 1px 2px rgba(15,47,53,.06),0 10px 28px rgba(15,47,53,.07);
  --display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1A1D;--surface:#10262A;--surface-2:#173338;--ink:#E4F0EE;--muted:#93ADB0;--line:#24454B;
  --saffron:#F6C232;--saffron-soft:#3A3010;--on-saffron:#241A00;
  --teal:#2BB3A5;--teal-soft:#123C3A;--on-teal:#04201D;
  --good:#4CC27D;--good-soft:#123826;--bad:#F0705F;--bad-soft:#40201B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1A1D;--surface:#10262A;--surface-2:#173338;--ink:#E4F0EE;--muted:#93ADB0;--line:#24454B;
  --saffron:#F6C232;--saffron-soft:#3A3010;--on-saffron:#241A00;
  --teal:#2BB3A5;--teal-soft:#123C3A;--on-teal:#04201D;
  --good:#4CC27D;--good-soft:#123826;--bad:#F0705F;--bad-soft:#40201B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
#app{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.25;text-wrap:balance;margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.num,.tnum{font-variant-numeric:tabular-nums}

/* buttons & inputs */
.btn{border:0;border-radius:12px;padding:.6em 1.1em;font-weight:600;background:var(--surface-2);color:var(--ink);display:inline-flex;gap:.4em;align-items:center;justify-content:center}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--teal);color:var(--on-teal)}
.btn.gold{background:var(--saffron);color:var(--on-saffron)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.inp{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:.6em .8em;font-size:1.05rem}
.inp:focus{border-color:var(--teal);outline:none}

/* login */
.login{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;min-height:80vh}
.login-hero h1{font-size:clamp(2rem,5vw,3.4rem);font-weight:800}
.login-hero h1 em{font-style:normal;color:var(--teal)}
.eyebrow{font-size:.82rem;letter-spacing:.04em;color:var(--muted);font-weight:600}
.hero-sq{margin-top:22px;display:grid;grid-template-columns:repeat(3,64px);gap:6px;direction:ltr}
.hero-sq span{height:64px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-size:1.7rem;font-weight:700;background:var(--surface);border:2px solid var(--line);animation:pop .5s both}
.hero-sq span:nth-child(odd){background:var(--saffron-soft);border-color:transparent}
@keyframes pop{from{transform:scale(.85);opacity:.4}to{transform:none;opacity:1}}
.login-cards{display:grid;gap:16px}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:22px}
.card h2{font-size:1.35rem;margin-bottom:10px}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-weight:600;font-size:.92rem}
details.card summary{cursor:pointer;font-family:var(--display);font-size:1.15rem;font-weight:700;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"＋";float:left;color:var(--muted)}
details[open].card summary::after{content:"－"}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em}
.credit{color:var(--muted);font-size:.9rem;margin-top:14px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:44px;height:44px;border-radius:12px;background:var(--saffron);display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:6px}
.logo i{background:var(--on-saffron);border-radius:2px;opacity:.85}
.logo i:nth-child(even){opacity:.25}
.brand h1{font-size:1.25rem}
.brand small{display:block;color:var(--muted);font-size:.85rem}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{border-radius:999px;padding:.25em .8em;font-size:.85rem;font-weight:600;background:var(--surface-2)}
.pill.t{background:var(--teal-soft);color:var(--teal)}
.pill.s{background:var(--saffron-soft);color:var(--on-saffron)}
:root[data-theme="dark"] .pill.s{color:var(--saffron)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.s{color:var(--saffron)}}
.demo{background:var(--saffron-soft);border-radius:12px;padding:.5em .9em;font-size:.88rem;margin-bottom:10px}

/* timeline */
.timeline{display:flex;gap:3px;margin-bottom:6px;height:16px}
.seg{border:0;padding:0;border-radius:4px;background:var(--surface-2);position:relative;min-width:6px}
.seg.a5{background:color-mix(in srgb,var(--saffron) 35%,var(--surface-2))}
.seg.a6{background:color-mix(in srgb,var(--teal) 30%,var(--surface-2))}
.seg.done{opacity:.45}
.seg.cur{outline:3px solid var(--ink);outline-offset:1px}
.tl-legend{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.82rem;margin-bottom:16px}

/* main grid */
.main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.board{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.board-head{padding:18px 24px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.board-head.a5{background:var(--saffron);color:var(--on-saffron)}
.board-head.a6{background:var(--teal);color:var(--on-teal)}
.board-head.a0{background:var(--surface-2)}
.board-head .eyebrow{color:inherit;opacity:.8}
.board-head h2{font-size:clamp(1.4rem,3vw,2rem);font-weight:800}
.timer{font-family:var(--display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.25);border-radius:12px;padding:.1em .6em;min-width:4.5em;text-align:center}
.board-head.a0 .timer{background:var(--surface)}
.timer.over{background:var(--bad);color:#fff}
.board-body{padding:22px 24px 26px;display:grid;gap:20px}
.prompt{font-size:1.12rem;max-width:68ch}
.prompt b{color:var(--teal)}
.hint{background:var(--surface-2);border-radius:12px;padding:.55em .9em;font-size:.95rem}

/* squares */
.sq-wrap{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.sq{display:grid;grid-template-columns:repeat(var(--n),var(--cs,72px));gap:6px;direction:ltr}
.cell{height:var(--cs,72px);border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:calc(var(--cs,72px) * .4);background:var(--surface-2);border:2px solid transparent;transition:background .15s,border-color .15s,transform .15s;user-select:none}
.cell.hl{background:var(--saffron);color:var(--on-saffron);transform:scale(1.04)}
.cell.drop{border:2px dashed var(--line);background:transparent;cursor:pointer}
.cell.drop.filled{border-style:solid;border-color:var(--teal);background:var(--teal-soft);color:var(--ink)}
.cell.drop.ready{border-color:var(--teal)}
.cell .ab{font-size:.62em;direction:rtl;unicode-bidi:isolate}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-width:420px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.25em .75em;font-size:.88rem;font-variant-numeric:tabular-nums}
.chip.on{background:var(--saffron);border-color:var(--saffron);color:var(--on-saffron)}
.chip.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.chip.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border-radius:14px;background:var(--surface-2)}
.tok{border:0;min-width:56px;height:48px;padding:0 10px;border-radius:12px;background:var(--surface);font-family:var(--display);font-weight:700;font-size:1.2rem;box-shadow:var(--shadow)}
.tok.sel{background:var(--saffron);color:var(--on-saffron);transform:translateY(-3px)}
.status{font-weight:700}
.status.ok{color:var(--good)}
.mini-grid{display:flex;flex-wrap:wrap;gap:14px}
.mini-grid .sq{--cs:34px;gap:3px}
.mini-grid .cell{border-radius:7px}

/* answers */
.ans{border-top:1px dashed var(--line);padding-top:18px;display:grid;gap:14px}
.ans h3{font-size:1.1rem}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.f{display:grid;gap:6px}
.f label{font-weight:600;font-size:.95rem}
.f .inp{font-family:var(--display);font-size:1.3rem;font-weight:700;text-align:center;direction:ltr}
.box{border-radius:12px;padding:.45em .8em;background:var(--surface-2);font-family:var(--display);font-weight:700;font-size:1.25rem;text-align:center;font-variant-numeric:tabular-nums;direction:ltr}
.box.ok{background:var(--good-soft);color:var(--good)}
.box.no{background:var(--bad-soft);color:var(--bad)}
.tbl-wrap{overflow-x:auto}
table.wt{border-collapse:separate;border-spacing:4px;min-width:100%}
table.wt th,table.wt td{background:var(--surface-2);border-radius:10px;padding:.4em .5em;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
table.wt th{background:var(--saffron-soft);font-weight:700}
table.wt td .inp{min-width:84px;padding:.35em;font-size:1.05rem}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:.75em 1em;text-align:start;font-weight:600;position:relative;overflow:hidden}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt .bar{position:absolute;inset-block:0;inset-inline-start:0;background:color-mix(in srgb,var(--teal) 16%,transparent);z-index:0}
.opt span{position:relative;z-index:1}
.opt .cnt{float:left;color:var(--muted);font-variant-numeric:tabular-nums}
.sent{background:var(--teal-soft);color:var(--teal);border-radius:12px;padding:.6em 1em;font-weight:600}
.explain{background:var(--good-soft);border-radius:16px;padding:16px 18px;display:grid;gap:10px}
.explain h3{color:var(--good);font-size:1.1rem}
.verdict{font-weight:700;font-size:1.05rem}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}

/* compare */
.cmp{display:grid;gap:12px;background:var(--surface-2);border-radius:16px;padding:16px}
.cmp input[type=range]{width:100%;accent-color:var(--teal)}
.brow{display:grid;grid-template-columns:110px minmax(0,1fr) 90px;gap:10px;align-items:center}
.btrack{height:22px;background:var(--surface);border-radius:8px;overflow:hidden}
.bfill{height:100%;border-radius:8px;transition:width .25s}
.bfill.A{background:var(--teal)}.bfill.B{background:var(--saffron)}
.chart-wrap{overflow-x:auto}
.math{direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.area{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;direction:ltr;max-width:560px;padding-top:26px}
.area-side{font-family:var(--display);font-weight:700;font-size:1.3rem}
.area-box{display:flex;height:130px;border-radius:14px;overflow:visible;gap:4px}
.area-part{position:relative;border-radius:12px;display:grid;place-items:center;text-align:center;padding:6px;font-family:var(--display);font-size:1.05rem}
.area-part.p1{background:var(--saffron-soft)}
.area-part.p2{background:var(--teal-soft)}
.area-top{position:absolute;top:-26px;inset-inline:0;text-align:center;font-weight:700}
.chart-wrap svg{max-width:100%;height:auto;display:block}

/* lobby / end */
.join-big{display:grid;gap:12px;justify-items:start}
.link-box{display:flex;gap:8px;flex-wrap:wrap;align-items:center;width:100%}
.link-box code{background:var(--surface-2);padding:.5em .8em;border-radius:10px;direction:ltr;word-break:break-all;flex:1;min-width:0;font-size:.9rem}
.names{display:flex;flex-wrap:wrap;gap:8px}
.names span{background:var(--teal-soft);color:var(--teal);border-radius:999px;padding:.3em .9em;font-weight:600;animation:pop .35s both}
.plan{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.plan li{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;align-items:center;padding:.5em .8em;border-radius:12px;background:var(--surface-2)}
.plan li b{font-variant-numeric:tabular-nums;font-size:.9rem}
.podium{display:flex;gap:12px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.pod{width:140px;border-radius:16px 16px 6px 6px;text-align:center;padding:14px 8px;display:grid;gap:4px}
.pod .rk{font-family:var(--display);font-size:2rem;font-weight:800}
.pod.p1{background:var(--saffron);color:var(--on-saffron);min-height:190px}
.pod.p2{background:var(--teal-soft);min-height:150px}
.pod.p3{background:var(--surface-2);min-height:120px}

/* panel */
.panel{display:grid;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.pcard{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:grid;gap:10px}
.pcard h3{font-size:1.05rem}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ctrl .wide{grid-column:1/-1}
.stat{display:flex;gap:10px;align-items:baseline}
.stat b{font-family:var(--display);font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--good)}
.rlist{display:grid;gap:4px;max-height:280px;overflow:auto;margin:0;padding:0;list-style:none}
.rlist li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:.3em .5em;border-radius:8px;font-size:.92rem}
.rlist li:nth-child(odd){background:var(--surface-2)}
.rlist .v{color:var(--muted);direction:ltr;font-variant-numeric:tabular-nums;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--good)}.dot.no{background:var(--bad)}
.lb{margin:0;padding:0;list-style:none;display:grid;gap:4px;counter-reset:r}
.lb li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:.35em .5em;border-radius:10px;counter-increment:r}
.lb li::before{content:counter(r);font-weight:800;color:var(--muted);text-align:center}
.lb li.me{background:var(--saffron-soft)}
.lb li b{font-variant-numeric:tabular-nums}
.key{background:var(--saffron-soft);border-radius:12px;padding:.6em .8em;font-size:.92rem}
.score-big{display:flex;justify-content:space-between;align-items:center}
.score-big b{font-family:var(--display);font-size:2.4rem;font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--bad-soft);border-radius:12px;padding:.5em .7em;font-size:.9rem}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--bg);padding:.6em 1.2em;border-radius:12px;font-weight:600;z-index:9}

@media (max-width:960px){.main{grid-template-columns:minmax(0,1fr)}.panel{position:static}.login{grid-template-columns:minmax(0,1fr);min-height:0}}
@media (max-width:520px){.sq{--cs:58px}.board-body{padding:18px 16px 22px}.board-head{padding:14px 16px}.brow{grid-template-columns:80px minmax(0,1fr) 70px}.hero-sq{grid-template-columns:repeat(3,52px)}.hero-sq span{height:52px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[,\s٬،]/g, '').replace('٫', '.');
const fmt = n => Number(n).toLocaleString('en-US');
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
/* identity is per browser tab, so a teacher can test a student view in a second tab */
const store = { get(k){ try{ return JSON.parse(sessionStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ sessionStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2200); }

const kLabel = k => k === 0 ? 'أ' : 'أ' + (k > 0 ? '+' : '−') + (Math.abs(k) === 1 ? '' : Math.abs(k)) + 'ب';
const abSum = k => '3أ' + (k === 0 ? '' : (k > 0 ? ' + ' : ' − ') + (Math.abs(k) === 1 ? '' : Math.abs(k)) + 'ب');
function lines(n, corners){
  const L=[], r=[...Array(n).keys()];
  r.forEach(i=>L.push({k:'صف '+(i+1), c:r.map(j=>i*n+j)}));
  r.forEach(j=>L.push({k:'عمود '+(j+1), c:r.map(i=>i*n+j)}));

  L.push({k:'القطر ↙', c:r.map(i=>i*n+(n-1-i))});
  if(corners) L.push({k:'الأركان', c:[0,n-1,n*(n-1),n*n-1]});
  return L;
}

/* ---------------- lesson content ---------------- */
const ACTS = {

/* ---------------- backends ---------------- */
const NET={status:'local', msg:''};
function Emitter(){ const cbs={}; return { on(e,f){ (cbs[e]=cbs[e]||[]).push(f); }, emit(e,d){ (cbs[e]||[]).forEach(f=>f(d)); } }; }

function LocalBackend(){
  const K='mw5_live_'+ROOM, E=Emitter();
  let mem={state:{},students:{},answers:{}};
  const read=()=>{ try{ const d=JSON.parse(localStorage.getItem(K)); if(d) return d; }catch(e){} return mem; };
  let bc=null; try{ bc=new BroadcastChannel(K); bc.onmessage=()=>fire(); }catch(e){}
  addEventListener('storage', e=>{ if(e.key===K) fire(); });
  function write(d){ mem=d; try{ localStorage.setItem(K, JSON.stringify(d)); }catch(e){} try{ bc&&bc.postMessage(1); }catch(e){} fire(); }
  function fire(){
    const d=read(), s=d.state||{};
    E.emit('state', s);
    E.emit('students', Object.values(d.students||{}).filter(x=>x.session===s.session));
    E.emit('answers', Object.values(d.answers||{}).filter(x=>x.session===s.session));
  }
  setTimeout(fire,0);
  return {
    mode:'local', on:E.on,
    setState(p, replace){ const d=read(); d.state = replace ? p : Object.assign({}, d.state, p, p.revealed ? {revealed:Object.assign({}, (d.state||{}).revealed, p.revealed)} : {}); write(d); },
    join(s){ const d=read(); d.students=d.students||{}; s.session=d.state.session; d.students[s.session+'|'+s.id]=s; write(d); },
    answer(a){ const d=read(); d.answers=d.answers||{}; a.session=d.state.session; d.answers[a.session+'|'+a.qid+'|'+a.sid]=a; write(d); }
  };
}

function FireBackend(cfg){
  const E=Emitter();
  NET.status='connecting';
  firebase.initializeApp(cfg);
  const db=firebase.firestore();
  try{ db.settings({experimentalAutoDetectLongPolling:true, merge:true}); }catch(e){}
  const room=db.collection('mawhiba_live').doc(ROOM);
  let sess=null, unsubs=[];
  const wErr=e=>{ console.warn(e); NET.status='error'; NET.msg='تعذّر الحفظ في قاعدة البيانات ('+(e&&e.code||'error')+'). راجع قواعد Firestore.'; E.emit('error',e); };
  const base=()=>room.collection('sessions').doc(sess);
  function rebind(){
    unsubs.forEach(u=>u()); unsubs=[];
    if(!sess){ E.emit('students',[]); E.emit('answers',[]); return; }
    unsubs.push(base().collection('students').onSnapshot(q=>E.emit('students', q.docs.map(d=>d.data())), e=>console.warn(e)));
    unsubs.push(base().collection('answers').onSnapshot(q=>E.emit('answers', q.docs.map(d=>d.data())), e=>console.warn(e)));
  }
  /* a snapshot served from the local cache does NOT prove the server is reachable */
  const slow=setTimeout(()=>{ if(NET.status!=='ok'){ NET.status='error';
    NET.msg='لم يتم الوصول إلى خادم Firestore خلال 12 ثانية. غالباً قاعدة البيانات لم تُنشأ بعد (Firestore Database ← Create database) أو أن الشبكة تحجب الاتصال.'; E.emit('error',{code:'timeout'}); } }, 12000);
  room.onSnapshot({includeMetadataChanges:true}, s=>{
    if(!s.metadata.fromCache){ clearTimeout(slow); if(NET.status!=='ok'){ NET.status='ok'; NET.msg=''; E.emit('net'); } }
    const st=s.data()||{}; if(st.session!==sess){ sess=st.session||null; rebind(); } S.serverState = !s.metadata.fromCache; E.emit('state', st); },
    e=>{ console.warn(e); NET.status='error';
      NET.msg = (e && e.code==='permission-denied') ? 'قاعدة البيانات رفضت الاتصال: انشر قواعد Firestore (Rules) التي تسمح بالمجموعة mawhiba_live.'
              : 'تعذّر الاتصال بقاعدة البيانات: تأكد أن Firestore مفعّل في مشروع Firebase. ('+(e&&e.code||'error')+')';
      E.emit('error', e); });
  return {
    mode:'firebase', on:E.on,
    setState(p, replace){ return (replace ? room.set(p) : room.set(p,{merge:true})).catch(wErr); },
    join(s){ if(sess) return base().collection('students').doc(s.id).set(s,{merge:true}).catch(wErr); },
    answer(a){ if(sess) return base().collection('answers').doc(a.qid+'__'+a.sid).set(a).catch(wErr); }
  };
}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function RtdbBackend(cfg){
  const E=Emitter();
  NET.status='connecting';
  firebase.initializeApp(cfg);
  const db=firebase.database();
  const room=db.ref('mawhiba_live/'+ROOM);
  let sess=null, offs=[];
  const fail=(e, where)=>{ console.warn(where, e); NET.status='error';
    const code=(e&&(e.code||e.message))||'error';
    NET.msg = /permission/i.test(code) ? 'قاعدة البيانات رفضت الاتصال: من Realtime Database ← Rules اسمح بالقراءة والكتابة على mawhiba_live ثم اضغط Publish.'
            : 'تعذّر الحفظ أو القراءة من قاعدة البيانات ('+code+').';
    E.emit('error', e); };
  const list=snap=>{ const v=snap.val()||{}; return Object.values(v); };
  function rebind(){
    offs.forEach(f=>f()); offs=[];
    if(!sess){ E.emit('students',[]); E.emit('answers',[]); return; }
    const sr=room.child('sessions/'+sess+'/students'), ar=room.child('sessions/'+sess+'/answers');
    const f1=sr.on('value', s=>E.emit('students', list(s)), e=>fail(e,'students'));
    const f2=ar.on('value', s=>E.emit('answers', list(s)), e=>fail(e,'answers'));
    offs.push(()=>sr.off('value',f1), ()=>ar.off('value',f2));
  }
  let everConnected=false;
  db.ref('.info/connected').on('value', s=>{
    if(s.val()===true){ everConnected=true; if(NET.status!=='ok' && !/رفضت/.test(NET.msg)){ NET.status='ok'; NET.msg=''; E.emit('net'); } }
    else if(everConnected){ NET.status='connecting'; NET.msg='انقطع الاتصال… جارٍ إعادة المحاولة'; E.emit('net'); }
  });
  setTimeout(()=>{ if(!everConnected){ NET.status='error';
    NET.msg='لم يتم الوصول إلى قاعدة البيانات خلال 12 ثانية. تأكد من رابط Realtime Database ومن اتصال الإنترنت.'; E.emit('error',{code:'timeout'}); } }, 12000);
  room.child('state').on('value', s=>{
    const st=s.val()||{}; if(st.session!==sess){ sess=st.session||null; rebind(); }
    S.serverState=true; E.emit('state', st);
  }, e=>fail(e,'state'));
  const clean=o=>JSON.parse(JSON.stringify(o, (k,v)=>v===undefined?null:v));
  return {
    mode:'firebase', on:E.on,
    setState(p, replace){
      if(replace) return room.child('state').set(clean(p)).catch(e=>fail(e,'set'));
      const u={}; Object.keys(p).forEach(k=>{ if(k==='revealed' && p.revealed && typeof p.revealed==='object') Object.keys(p.revealed).forEach(q=>u['revealed/'+q]=p.revealed[q]); else u[k]=p[k]; });
      return room.child('state').update(clean(u)).catch(e=>fail(e,'update'));
    },
    join(s){ if(sess) return room.child('sessions/'+sess+'/students/'+s.id).set(clean(s)).catch(e=>fail(e,'join')); },
    answer(a){ if(sess) return room.child('sessions/'+sess+'/answers/'+a.qid+'__'+a.sid).set(clean(a)).catch(e=>fail(e,'answer')); }
  };
}
async function makeBackend(){
  if(FIREBASE_CONFIG){
    const rt=!!FIREBASE_CONFIG.databaseURL;
    for(const src of FB_SOURCES){
      try{ await loadScript(src+'firebase-app-compat.js'); await loadScript(src+(rt?'firebase-database-compat.js':'firebase-firestore-compat.js'));
        if(window.firebase && rt && firebase.database) return RtdbBackend(FIREBASE_CONFIG);
        if(window.firebase && !rt && firebase.firestore) return FireBackend(FIREBASE_CONFIG); }
      catch(e){ console.warn('Firebase load failed from', src, e); }
    }
    NET.status='error'; NET.msg='تعذّر تحميل مكتبة Firebase. تحقق من اتصال الإنترنت ثم حدّث الصفحة.';
  }
  return LocalBackend();
}

function onData(kind){
  /* create a session only once, and only from a confirmed server snapshot (not the local cache) */
  if(isT() && !S.state.session && S.serverState!==false && !creatingSession){ creatingSession=true; newSession(); }
  if(S.state.session) creatingSession=false;
  if(me && me.role==='student' && S.state.session){
    const listed = S.students.some(x=>x.id===me.sid);
    if(joinedSession!==S.state.session || (!listed && kind==='students' && Date.now()-lastJoin>4000)){
      joinedSession=S.state.session; lastJoin=Date.now();
      B.join({id:me.sid, name:me.name, at:Date.now()});
    }
  }
  render();
}

function netLabel(){ return !B ? '🟡 جارٍ التحميل' : B.mode==='firebase'?(NET.status==='ok'?'🟢 متصل مباشر':NET.status==='error'?'🔴 غير متصل':'🟡 جارٍ الاتصال'):'⚪ وضع تجريبي'; }
function showNet(){ const n=$('#netLogin'); if(n) n.textContent='حالة الاتصال: '+netLabel()+(NET.msg?' — '+NET.msg:'');

function updateTimeline(){

}
function goStage(i){ i=Math.max(0,Math.min(STAGES.length-1,i)); B.setState({stage:i, stageAt:Date.now()}); }

/* ---------------- stage ---------------- */
function updateStage(){
  const c=cur(), s=STAGES[c], mine=s.q?myAns(s.id):null;
  const key=[S.state.session,c,revealed(s.id),!!mine,me.role, s.kind ? S.students.length+'|'+(s.kind==='end'?JSON.stringify(scores().slice(0,3)):'') : ''].join('§');
  if(key!==stageKey){ stageKey=key; drawStage(s, mine); }
  if(isT() && s.q && s.q.type==='choice') updateDist(s);
}
function drawStage(s, mine){
  const A=ACTS[s.act], rev=revealed(s.id);
  let body='';
  if(s.kind==='lobby') body=lobbyHTML();
  else if(s.kind==='end') body=endHTML();
  else{
    body += `<p class="prompt">${mth(s.prompt)}</p>`;
    if(s.hint) body += `<div class="hint">${mth(s.hint)}</div>`;
    if(s.viz && s.viz.sq) body += `<div class="sq-wrap" id="viz"></div>`;
    if(s.viz && s.viz.compare) body += `<div id="viz"></div>`;
    if(s.viz && s.viz.area) body += areaHTML(s.viz.area, rev);
    body += `<section class="ans" id="ans"></section>`;
    if(rev) body += explainHTML(s);
  }
  $('#board').innerHTML = `
    <header class="board-head ${A.cls}">
      <div><div class="eyebrow">${A.name}${A.sub?' · '+A.sub:''}</div><h2>${esc(s.title)}</h2></div>
      <div class="timer" id="timer">--:--</div>
    </header>
    <div class="board-body">${body}</div>`;
  if(s.kind==='lobby') mountLobby();
  if(s.viz && s.viz.sq) mountSquare($('#viz'), s.viz.sq, s.viz.n, {sums: s.viz.sums===true || (s.viz.sums==='reveal' && rev), corners:s.viz.corners});
  if(s.viz && s.viz.compare) mountCompare($('#viz'), rev);
  if(s.q) mountAnswer(s, mine, rev);
  tick();
}
function explainHTML(s){
  let h=`<div class="explain"><h3>الحل</h3><p style="margin:0">${mth(s.explain)}</p>`;
  if(s.example) h+=`<div class="mini-grid" style="--x:0">${squareStatic(s.example,3,s.exampleFmt)}</div>`;
  if(s.rot8) h+=`<div class="mini-grid">${transforms(LOSHU,3).map(g=>squareStatic(g,3)).join('')}</div>`;
  return h+'</div>';
}
/* keep math expressions left-to-right inside Arabic sentences */
function mth(t){ return String(t??'').replace(/[(\d][\d\s,×+−\-=().÷]*[\d)](?:\s*=)?/g, m=>{ const lead=m.match(/^\s*/)[0]; return `<span class="math">${m}</span>`; }); }
function areaHTML([h,a,b], rev){
  return `<div class="area" aria-label="نموذج المساحة ${h} × (${a} + ${b})">
    <div class="area-side">${h}</div>
    <div class="area-box">
      <div class="area-part p1" style="flex-grow:${a}"><span class="area-top">${a}</span><b dir="ltr">${h} × ${a}${rev?' = '+fmt(h*a):''}</b></div>
      <div class="area-part p2" style="flex-grow:${Math.max(b,a/3)}"><span class="area-top">${b}</span><b dir="ltr">${h} × ${b}${rev?' = '+fmt(h*b):''}</b></div>
    </div></div>`;
}
function squareStatic(arr,n,f){ return `<div class="sq" style="--n:${n}">${arr.map(v=>`<div class="cell">${f==='ab'?`<span class="ab">${kLabel(v)}</span>`:v}</div>`).join('')}</div>`; }
function transforms(a,n){
  const at=(g,r,c)=>g[r*n+c], out=[]; let g=a.slice();
  const rot=g=>{const o=[];for(let r=0;r<n;r++)for(let c=0;c<n;c++)o.push(at(g,n-1-c,r));return o;};
  const flip=g=>{const o=[];for(let r=0;r<n;r++)for(let c=0;c<n;c++)o.push(at(g,r,n-1-c));return o;};
  for(let i=0;i<4;i++){ out.push(g); out.push(flip(g)); g=rot(g); }
  return out;
}

/* interactive static square (tap a line to highlight it) */
function mountSquare(el, arr, n, o){
  const Ls=lines(n,o.corners);
  el.innerHTML = `<div class="sq" style="--n:${n}">${arr.map((v,i)=>`<div class="cell" data-i="${i}">${v}</div>`).join('')}</div>
    <div class="chips">${Ls.map((l,i)=>`<button class="chip" data-l="${i}">${l.k}: <b>${o.sums?l.c.reduce((a,c)=>a+arr[c],0):'؟'}</b></button>`).join('')}</div>`;
  el.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{
    const on=!ch.classList.contains('on');
    el.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
    el.querySelectorAll('.cell').forEach(x=>x.classList.remove('hl'));
    if(on){ ch.classList.add('on'); Ls[+ch.dataset.l].c.forEach(i=>el.querySelector(`.cell[data-i="${i}"]`).classList.add('hl')); }
  });
}

/* compare accountants */
function mountCompare(el, rev){
  const A=n=>600*n+3000, Bf=n=>700*(n+3);
  el.innerHTML = `<div class="cmp">
    <label for="cmpN">عدد ساعات العمل: <b class="tnum" id="cmpNv"></b></label>
    <input type="range" id="cmpN" min="1" max="14" step="1" value="${L.cmpN}">
    <div class="brow"><span>المحاسب (أ)</span><div class="btrack"><div class="bfill A" id="bA"></div></div><b class="tnum" id="vA"></b></div>
    <div class="brow"><span>المحاسب (ب)</span><div class="btrack"><div class="bfill B" id="bB"></div></div><b class="tnum" id="vB"></b></div>
    <div class="muted" id="cmpMsg"></div>
  </div>${rev?`<div class="chart-wrap">${chartSVG()}</div>`:''}`;
  const upd=()=>{ const n=+$('#cmpN').value; L.cmpN=n; const a=A(n), b=Bf(n), M=13000;
    $('#cmpNv').textContent=n; $('#vA').textContent=fmt(a); $('#vB').textContent=fmt(b);
    $('#bA').style.width=(a/M*100)+'%'; $('#bB').style.width=(b/M*100)+'%';
    $('#cmpMsg').textContent = a===b ? 'الأجرتان متساويتان!' : (a>b ? `المحاسب (ب) أوفر بـ ${fmt(a-b)} ريال` : `المحاسب (أ) أوفر بـ ${fmt(b-a)} ريال`); };
  $('#cmpN').oninput=upd; upd();
}
function chartSVG(){
  const W=560,H=280,l=56,r=16,t=16,b=40, X=n=>l+n*(W-l-r)/14, Y=v=>H-b-v*(H-t-b)/12000;
  const A=n=>600*n+3000, Bf=n=>700*(n+3);
  let g='';
  for(let v=0;v<=12000;v+=3000) g+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${l-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v)}</text>`;
  for(let n=0;n<=14;n+=2) g+=`<text x="${X(n)}" y="${H-b+18}" text-anchor="middle" font-size="11" fill="var(--muted)">${n}</text>`;
  g+=`<text x="${(l+W-r)/2}" y="${H-4}" text-anchor="middle" font-size="12" fill="var(--muted)">عدد الساعات (ن)</text>`;
  g+=`<line x1="${X(0)}" y1="${Y(A(0))}" x2="${X(14)}" y2="${Y(A(14))}" stroke="var(--teal)" stroke-width="3"/>`;
  g+=`<line x1="${X(0)}" y1="${Y(Bf(0))}" x2="${X(14)}" y2="${Y(Bf(14))}" stroke="var(--saffron)" stroke-width="3"/>`;
  g+=`<circle cx="${X(9)}" cy="${Y(8400)}" r="6" fill="var(--ink)"/><text x="${X(9)-12}" y="${Y(8400)-14}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">9 ساعات = 8,400 ريال</text>`;
  g+=`<text x="${X(14)-4}" y="${Y(A(14))+18}" text-anchor="end" font-size="12" font-weight="700" fill="var(--teal)">(أ)</text><text x="${X(14)-4}" y="${Y(Bf(14))-8}" text-anchor="end" font-size="12" font-weight="700" fill="var(--saffron)">(ب)</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" direction="ltr" style="direction:ltr" role="img" aria-label="مقارنة أجرة المحاسبين">${g}</svg>`;
}

/* ---------------- answers ---------------- */
function checkNum(q, vals){ return q.fields.every((f,i)=>norm(vals[i])!=='' && Number(norm(vals[i]))===f.a); }
function gridSums(q, cells){ return lines(q.n).map(l=>({k:l.k, full:l.c.every(i=>cells[i]!=null), s:l.c.reduce((a,i)=>a+(cells[i]!=null?q.tokens[cells[i]].v:0),0)})); }
function checkGrid(q, cells){ return cells.every(c=>c!=null) && gridSums(q,cells).every(x=>x.s===q.target); }
const sumText = (q,s) => q.fmt==='ab' ? abSum(s) : s;

function mountAnswer(s, mine, rev){
  const el=$('#ans'), q=s.q, T=isT();
  const locked = T ? false : (!!mine || rev);
  let h='';
  if(q.type==='num'){
    const vals = mine ? mine.value : null;
    h += `<h3>${T?'الإجابة':(locked?'إجابتك':'أجب هنا')}</h3>` + numFieldsHTML(s, vals, T, locked, rev);
  } else if(q.type==='choice'){
    h += `<h3>${T?'الخيارات':'اختر الإجابة'}</h3><div class="opts">${q.opts.map((o,i)=>{
      let cls=''; if(rev && i===q.a) cls='ok'; else if(rev && mine && mine.value===i) cls='no'; else if(!rev && mine && mine.value===i) cls='sel';
      return `<button class="opt ${cls}" data-o="${i}" ${locked||T?'disabled':''}>${T?'<i class="bar" style="width:0"></i>':''}<span>${mth(esc(o))}</span>${T?'<span class="cnt">0</span>':''}</button>`; }).join('')}</div>`;
  } else if(q.type==='grid'){
    h += `<h3>${T?'جرّب الترتيب أمام الطلاب':'رتّب المربع'}</h3><div id="gridBox"></div>`;
  }
  if(!T){
    if(!locked) h += `<div><button class="btn primary" id="send">إرسال الإجابة</button> <span class="err" id="ansErr"></span></div>`;
    else if(mine && !rev) h += `<div class="sent">تم إرسال إجابتك. انتظر حتى يعرض المعلم الحل.</div>`;
    else if(rev && mine) h += `<div class="verdict ${mine.correct?'ok':'no'}">${mine.correct?'إجابة صحيحة! أحسنت 🎉':'إجابة غير صحيحة، راجع الحل بالأسفل.'}</div>`;
    else if(rev) h += `<div class="verdict no">انتهى وقت الإجابة على هذا السؤال.</div>`;
  }
  el.innerHTML=h;

  if(q.type==='choice' && !locked && !T){
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ L.choice[s.id]=+b.dataset.o; el.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel', x===b)); });
    if(L.choice[s.id]!=null) el.querySelector(`.opt[data-o="${L.choice[s.id]}"]`).classList.add('sel');
  }
  if(q.type==='grid'){
    if(locked && mine) mountGrid($('#gridBox'), s, mine.value, true);
    else if(locked) mountGrid($('#gridBox'), s, Array(q.n*q.n).fill(null), true);
    else mountGrid($('#gridBox'), s, null, false);
  }
  if(q.type==='num' && !locked && !T){
    el.querySelectorAll('input[data-f]').forEach(inp=>{ inp.oninput=()=>{ (L['d_'+s.id]=L['d_'+s.id]||[])[+inp.dataset.f]=inp.value; }; });
  }
  const send=$('#send');
  if(send) send.onclick=()=>submit(s);
}
function numFieldsHTML(s, vals, T, locked, rev){
  const q=s.q, d=L['d_'+s.id]||[];
  const cell=i=>{
    if(T) return `<div class="box ${rev?'ok':''}">${rev?fmt(q.fields[i].a):'؟'}</div>`;
    if(locked){ const v=vals?vals[i]:''; const ok=vals && norm(v)!=='' && Number(norm(v))===q.fields[i].a;
      return `<div class="box ${rev?(ok?'ok':'no'):''}">${esc(v||'—')}${rev&&!ok?` <small>(${fmt(q.fields[i].a)})</small>`:''}</div>`; }
    return `<input class="inp" id="f_${s.id}_${i}" data-f="${i}" inputmode="numeric" autocomplete="off" value="${esc(d[i]||'')}" aria-label="${esc(q.fields[i].l)}">`;
  };
  if(q.table){
    const t=q.table;
    return `<div class="tbl-wrap"><table class="wt"><tr><th>${t.h}</th>${t.cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr>
      <tr><th>${t.r}</th>${t.cols.map(c=>c[1]>=100 ? `<td>${fmt(c[1])}</td>` : `<td>${cell(c[1])}</td>`).join('')}</tr></table></div>`;
  }
  return `<div class="fields">${q.fields.map((f,i)=>`<div class="f"><label for="f_${s.id}_${i}">${mth(esc(f.l))}</label>${cell(i)}</div>`).join('')}</div>`;
}

function mountGrid(box, s, given, ro){
  const q=s.q, n=q.n;
  if(!ro && !L.grid[s.id]) L.grid[s.id]={cells:Array(n*n).fill(null), sel:null};
  const G = ro ? {cells:given, sel:null} : L.grid[s.id];
  const draw=()=>{
    const used=new Set(G.cells.filter(c=>c!=null));
    const sums=gridSums(q,G.cells), ok=checkGrid(q,G.cells);
    box.innerHTML = `
      <div class="sq-wrap">
        <div class="sq" style="--n:${n}">${G.cells.map((c,i)=>`<div class="cell drop ${c!=null?'filled':''} ${G.sel!=null&&c==null?'ready':''}" data-i="${i}" role="button" tabindex="${ro?-1:0}" aria-label="خانة ${i+1}">${c!=null?(q.fmt==='ab'?`<span class="ab">${q.tokens[c].l}</span>`:q.tokens[c].l):''}</div>`).join('')}</div>
        <div class="chips">${sums.map(x=>`<span class="chip ${x.full?(x.s===q.target?'ok':'no'):''}">${x.k}: <b>${x.full||x.s?sumText(q,x.s):'—'}</b></span>`).join('')}</div>
      </div>
      ${ro?'':`<div class="tray" aria-label="الأرقام المتاحة">${q.tokens.map((t,i)=>used.has(i)?'':`<button class="tok ${G.sel===i?'sel':''}" data-t="${i}"><span ${q.fmt==='ab'?'class="ab"':''}>${t.l}</span></button>`).join('') || '<span class="muted">وضعت كل الأرقام. اضغط على أي خانة لإرجاع رقمها.</span>'}</div>`}
      <div class="status ${ok?'ok':''}">${ok?'مربع سحري صحيح! المجموع '+sumText(q,q.target):(G.cells.every(c=>c!=null)?'لم يصبح المربع سحرياً بعد. بدّل بعض الأرقام.':'')}</div>`;
    if(ro) return;
    box.querySelectorAll('.tok').forEach(b=>b.onclick=()=>{ const t=+b.dataset.t; G.sel = G.sel===t?null:t; draw(); });
    box.querySelectorAll('.cell.drop').forEach(c=>{ const act=()=>{ const i=+c.dataset.i;
        if(G.cells[i]!=null){ G.cells[i]=G.sel; G.sel=null; }
        else if(G.sel!=null){ G.cells[i]=G.sel; G.sel=null; }
        draw(); };
      c.onclick=act; c.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); act(); } }; });
  };
  draw();
}

function submit(s){
  const q=s.q; let value, correct;
  if(q.type==='num'){
    value = q.fields.map((_,i)=>{ const el=document.getElementById(`f_${s.id}_${i}`); return el?el.value.trim():''; });
    if(value.some(v=>norm(v)==='')){ $('#ansErr').textContent='أكمل كل الخانات قبل الإرسال.'; return; }
    if(value.some(v=>isNaN(Number(norm(v))))){ $('#ansErr').textContent='اكتب أعداداً فقط.'; return; }
    correct = checkNum(q,value);
  } else if(q.type==='choice'){
    value = L.choice[s.id];
    if(value==null){ $('#ansErr').textContent='اختر إجابة أولاً.'; return; }
    correct = value===q.a;
  } else {
    const G=L.grid[s.id]; value = G.cells.slice();
    if(value.some(c=>c==null)){ $('#ansErr').textContent='املأ كل خانات المربع أولاً.'; return; }
    correct = checkGrid(q,value);
  }
  const a={qid:s.id, sid:me.sid, name:me.name, value, correct, at:Date.now()};
  S.answers = S.answers.filter(x=>!(x.qid===s.id && x.sid===me.sid)).concat([Object.assign({session:S.state.session},a)]);
  try{ B.answer(a); }catch(e){ console.warn(e); }
  toast('تم الإرسال');
  render();
}

function updateDist(s){
  const list=S.answers.filter(a=>a.qid===s.id), tot=Math.max(1,list.length);
  document.querySelectorAll('#ans .opt').forEach(b=>{ const i=+b.dataset.o, c=list.filter(a=>a.value===i).length;
    const bar=b.querySelector('.bar'), cnt=b.querySelector('.cnt'); if(bar) bar.style.width=(c/tot*100)+'%'; if(cnt) cnt.textContent=c; });
}

/* lobby & end */
function joinLink(){ return location.href.split('#')[0]; }
function lobbyHTML(){
  const groups=[]; STAGES.forEach((st,i)=>{ const g=groups[groups.length-1]; if(g && g.act===st.act && st.act!==0) { g.min+=st.min; g.n++; } else groups.push({act:st.act, from:startMin(i), min:st.min, n:st.kind?0:1, title:st.title}); });
  const plan = `<ul class="plan">${groups.map(g=>`<li><b>${g.from}–${g.from+g.min} د</b><span>${g.act===0?g.title:ACTS[g.act].sub+' ('+g.n+(g.n>2?' أسئلة':g.n===2?' سؤالان':' سؤال')+')'}</span></li>`).join('')}</ul>`;
  if(isT()) return `<div class="join-big">
      <p class="prompt">اطلب من الطلاب فتح الرابط وكتابة أسمائهم. ستظهر الأسماء هنا مباشرة.</p>
      <div class="link-box"><code id="jl">${esc(joinLink())}</code><button class="btn gold" id="copyL">نسخ الرابط</button></div>
      <div class="stat"><b>${S.students.length}</b><span>طالب انضموا</span></div>
      <div class="names">${S.students.map(x=>`<span>${esc(x.name)}</span>`).join('') || '<span class="muted" style="background:none">لم ينضم أحد بعد</span>'}</div>
    </div>${plan}`;
  return `<p class="prompt">أهلاً <b>${esc(me.name)}</b>! أنت الآن في الحصة. سيبدأ المعلم النشاط بعد قليل، وستظهر الأسئلة هنا تلقائياً.</p>
    <div class="names">${S.students.map(x=>`<span>${esc(x.name)}</span>`).join('')}</div>${plan}`;
}
function mountLobby(){ const b=$('#copyL'); if(b) b.onclick=()=>{ const t=joinLink();
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast('تم نسخ الرابط'),()=>selectText($('#jl'))); else selectText($('#jl')); }; }
function selectText(el){ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('الرابط محدد، انسخه'); }
function endHTML(){
  const sc=scores(), top=sc.slice(0,3), order=[1,0,2];
  return `<p class="prompt">أحسنتم جميعاً! هؤلاء أبطال الحصة:</p>
    <div class="podium">${order.filter(i=>top[i]).map(i=>`<div class="pod p${i+1}"><div class="rk">${i+1}</div><b>${esc(top[i].name)}</b><span class="tnum">${top[i].pts} نقطة</span></div>`).join('') || '<span class="muted">لا توجد نتائج بعد.</span>'}</div>
    <div class="explain"><h3>ماذا تعلّمنا اليوم؟</h3>
      <p style="margin:0">نستعمل الحقائق الأساسية وأنماط الأصفار للضرب ذهنياً، ونجزّئ العدد بخاصية التوزيع: 7 × 24 = (7 × 20) + (7 × 4).</p>
      <p style="margin:0">نقدّر قبل أن نحسب لنتحقق من معقولية الإجابة، ولا ننسى الصفر في الناتج الجزئي الثاني عند الضرب في عدد من رقمين.</p>
      <p style="margin:0">خصائص الضرب: الإبدال، والتجميع، والعنصر المحايد (1)، والضرب في الصفر.</p></div>`;
}

/* ---------------- panel ---------------- */
function updatePanel(){
  const c=cur(), s=STAGES[c], sc=scores(), el=$('#panel');
  const lb = n => `<ol class="lb">${sc.slice(0,n).map(x=>`<li class="${me&&x.id===me.sid?'me':''}"><span>${esc(x.name)}</span><b>${x.pts}</b></li>`).join('') || '<li style="grid-template-columns:1fr"><span class="muted">تظهر النقاط بعد عرض أول حل.</span></li>'}</ol>`;
  if(isT()){
    const list = s.q ? S.answers.filter(a=>a.qid===s.id) : [];
    const ok=list.filter(a=>a.correct).length, tot=S.students.length;
    const keyTxt = s.q ? (s.q.type==='num' ? s.q.fields.map(f=>`${mth(f.l)} <b>${fmt(f.a)}</b>`).join('<br>') : s.q.type==='choice' ? mth(esc(s.q.opts[s.q.a])) : 'أي ترتيب تكون فيه كل الصفوف والأعمدة والأقطار متساوية') : '';
    el.innerHTML = `
      <section class="pcard"><h3>التحكم في الحصة</h3>
        <div class="ctrl">
          <button class="btn ghost" id="prev" ${c===0?'disabled':''}>→ السابق</button>
          <button class="btn primary" id="next" ${c===STAGES.length-1?'disabled':''}>التالي ←</button>
          ${s.q?`<button class="btn gold wide" id="reveal" ${revealed(s.id)?'disabled':''}>${revealed(s.id)?'تم عرض الحل':'عرض الحل وإغلاق الإجابات'}</button>`:''}
          <button class="btn ghost wide" id="rt">إعادة تشغيل مؤقت المرحلة</button>
        </div>
        ${L.confirmReset?`<div class="confirm"><span>ستُمسح الأسماء والنقاط. متأكد؟</span><button class="btn danger" id="rsYes">نعم، حصة جديدة</button><button class="btn ghost" id="rsNo">إلغاء</button></div>`:`<button class="btn ghost" id="rs">بدء حصة جديدة</button>`}
      </section>
      ${s.q?`<section class="pcard"><h3>إجابات هذا السؤال</h3>
        <div class="stat"><b>${list.length}</b><span>من ${tot} أجابوا · ${ok} صحيحة</span></div>
        <div class="meter"><i style="width:${list.length?ok/list.length*100:0}%"></i></div>
        <ul class="rlist">${list.sort((a,b)=>a.at-b.at).map(a=>`<li><span>${esc(a.name)}</span><span class="v">${esc(ansText(s,a.value))}</span><i class="dot ${a.correct?'ok':'no'}"></i></li>`).join('')}</ul>
        <div class="key">مفتاح الإجابة:<br>${keyTxt}</div></section>`:''}
      <section class="pcard"><h3>لوحة الصدارة</h3>${lb(10)}</section>`;
    $('#prev').onclick=()=>goStage(c-1); $('#next').onclick=()=>goStage(c+1);
    $('#rt').onclick=()=>B.setState({stageAt:Date.now()});
    const rv=$('#reveal'); if(rv) rv.onclick=()=>B.setState({revealed:{[s.id]:true}});
    if($('#rs')) $('#rs').onclick=()=>{ L.confirmReset=true; updatePanel(); };
    if($('#rsYes')) $('#rsYes').onclick=()=>{ L.confirmReset=false; L.grid={}; L.choice={}; newSession(); };
    if($('#rsNo')) $('#rsNo').onclick=()=>{ L.confirmReset=false; updatePanel(); };
  } else {
    const mine=sc.find(x=>x.id===me.sid), rank=sc.findIndex(x=>x.id===me.sid)+1;
    const answered=S.answers.filter(a=>a.sid===me.sid).length, qs=STAGES.filter(x=>x.q).length;
    el.innerHTML = `
      <section class="pcard"><div class="score-big"><div><h3>نقاطي</h3><span class="muted">${rank?`الترتيب ${rank} من ${sc.length}`:(S.state.session?'جارٍ تسجيل اسمك…':'في انتظار أن يدخل المعلم ويفتح الحصة…')}</span></div><b>${mine?mine.pts:0}</b></div>
        <div class="meter"><i style="width:${answered/qs*100}%;background:var(--teal)"></i></div><span class="muted">أجبت عن ${answered} من ${qs} سؤالاً</span></section>
      <section class="pcard"><h3>لوحة الصدارة</h3>${lb(5)}</section>`;
  }
}
function ansText(s,v){
  if(s.q.type==='num') return v.join(' ، ');
  if(s.q.type==='choice') return s.q.opts[v]||'';
  return checkGrid(s.q,v)?'مربع سحري':'غير سحري';
}

/* ---------------- timer ---------------- */
function tick(){
  const el=$('#timer'); if(!el || !me) return;
  const s=STAGES[cur()], at=S.state.stageAt;
  if(!at){ el.textContent='--:--'; return; }
  let rem=Math.round(s.min*60-(Date.now()-at)/1000);
  const over=rem<0; rem=Math.abs(rem);
  el.textContent=(over?'+':'')+String(Math.floor(rem/60)).padStart(2,'0')+':'+String(rem%60).padStart(2,'0');
  el.classList.toggle('over', over);
  el.setAttribute('aria-label', over?'تجاوز الوقت':'الوقت المتبقي');
}
</script>

</body>
